apiVersion: apps/v1
kind: Deployment
metadata:
  name: spendwise-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spendwise-frontend
  template:
    metadata:
      labels:
        app: spendwise-frontend
    spec:
      containers:
        - name: frontend
          image: shravrocks/spendwise-frontend:v24
          imagePullPolicy: Always

          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: spendwise-frontend-service
spec:
  selector:
    app: spendwise-frontend
  ports:
    - port: 3000
      targetPort: 3000
