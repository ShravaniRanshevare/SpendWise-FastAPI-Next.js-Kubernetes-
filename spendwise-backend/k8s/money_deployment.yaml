apiVersion: apps/v1
kind: Deployment
metadata:
  name: spendwise-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spendwise-backend
  template:
    metadata:
      labels:
        app: spendwise-backend
    spec:
      containers:
        - name: spendwise-backend
          image: shravrocks/spendwise-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DATABASE_HOST
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DATABASE_NAME
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DATABASE_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DATABASE_PASSWORD
            - name: DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DATABASE_PORT
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: JWT_SECRET
            - name: ALGORITHM
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: ALGORITHM
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: spendwise-backend-service
spec:
  selector:
    app: spendwise-backend
  ports:
    - name: http
      port: 80
      targetPort: 8000
  type: LoadBalancer
